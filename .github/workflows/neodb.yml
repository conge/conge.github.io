# .github/workflows/neodb.yml
# ref: https://github.com/eallion/eallion.com/blob/main/.github/workflows/sync-neodb-data.yml
name: neodb

on:
    schedule:
    - cron: "0 0 * * *"
    watch:
      types: [started]
    workflow_dispatch:
      inputs:
        force:
          description: "强制全量同步（忽略 UUID/count 比较）"
          type: boolean
          default: false
  

#  workflow_dispatch:
#  repository_dispatch:
#    types: [sync-neodb]

jobs:
  synch_neodb:
    name: Sync NeoDB Data
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    # 检查是否安装了 JQ
    - name: Check JQ
      run: |
        if ! command -v jq &> /dev/null; then
          echo "jq is not installed. Installing..."
          sudo apt-get update
          sudo apt-get install -y jq
        else
          echo "jq is already installed."
        fi
        # 把当前目录保存到环境变量中
        echo "WORK_DIR=$(pwd)" >> $GITHUB_ENV

    # 获取本地现有文件中最新的 UUID 和记录总数
    - name: Get Local Current UUID and Count
      run: |
        {
          echo "CURRENT_UUID=$(jq -r '.data[0].item.uuid' _data/neodb/neodb_data.json)"
          echo "CURRENT_COUNT=$(jq -r '.count // (.data | length)' _data/neodb/neodb_data.json)"
        } >> $GITHUB_ENV

    # 获取远程最新的 UUID、总数与页数
    - name: Get NeoDB Latest UUID, Count and Pages
      run: |
        RESPONSE=$(curl -sS -f -X 'GET' \
          'https://neodb.social/api/me/shelf/complete?page=1' \
          -H 'accept: application/json' \
          -H 'Authorization: Bearer ${{ secrets.NEODB_ACCESS_TOKEN }}')

        REMOTE_UUID=$(echo "$RESPONSE" | jq -r '.data[0].item.uuid')
        REMOTE_COUNT=$(echo "$RESPONSE" | jq -r '.count')
        REMOTE_PAGES=$(echo "$RESPONSE" | jq -r '.pages')

        # 接口异常时直接失败，避免用空响应覆盖本地数据
        if [ -z "$REMOTE_UUID" ] || [ "$REMOTE_UUID" = "null" ] ||
           ! [[ "$REMOTE_COUNT" =~ ^[0-9]+$ ]] || ! [[ "$REMOTE_PAGES" =~ ^[0-9]+$ ]]; then
          echo "Invalid response from NeoDB: $RESPONSE" >&2
          exit 1
        fi

        {
          echo "REMOTE_UUID=$REMOTE_UUID"
          echo "REMOTE_COUNT=$REMOTE_COUNT"
          echo "REMOTE_PAGES=$REMOTE_PAGES"
        } >> $GITHUB_ENV

    # 对比本地的 UUID / 记录总数和远程值，任一变化就下载新数据
    # 只比较最新一条的 UUID 不够：补录（回溯日期）的条目会排在最新记录之后，
    # 最新 UUID 不变，但总数会增加。
    - name: UUID and Count Compare
      run: |
        if [ "${{ github.event.inputs.force }}" = "true" ] ||
           [ "$REMOTE_UUID" != "$CURRENT_UUID" ] || [ "$REMOTE_COUNT" != "$CURRENT_COUNT" ]; then
          echo "Changed: ${CURRENT_UUID}/${CURRENT_COUNT} -> ${REMOTE_UUID}/${REMOTE_COUNT}. Syncing."
          echo "NEED_UPDATE=true" >> $GITHUB_ENV
        else
          echo "Unchanged: ${CURRENT_UUID}/${CURRENT_COUNT}. Skipping sync."
          echo "NEED_UPDATE=false" >> $GITHUB_ENV
        fi

    # 下载所有数据
    - name: Get All NeoDB
      if: ${{ env.NEED_UPDATE == 'true' }}
      run: |
        pages=${{ env.REMOTE_PAGES }}

        mkdir -p ${{ env.WORK_DIR }}/_data/neodb

        # 个人使用，新建 WorkDIR ，排除 vercel.json 和 package.json 等
        mkdir neodb
        cd neodb

        # 下载数据
        for ((i=1; i<=$pages; i++)); do
          url="https://neodb.social/api/me/shelf/complete?page=$i"
          filename=$(printf "neodb_data%03d.json" "$i")

        # 下载文件并保存为对应的文件名
        curl -fsS -X 'GET' "$url" \
          -H 'accept: application/json' \
          -H 'Authorization: Bearer ${{ secrets.NEODB_ACCESS_TOKEN }}' > "$filename"
        done

        # 把所有数据合并成一个文件
        jq -c -s '{data: map(.data[]) | unique | sort_by(.created_time) | reverse, pages: .[0].pages, count: .[0].count}' neodb_data*.json > neodb_data.json

        # 更新 NeoDB 数据
        mkdir -p ${{ env.WORK_DIR }}/_data/neodb/
        cp -f neodb_data.json ${{ env.WORK_DIR }}/_data/neodb/
        cd ..

    # 按 category 分类 JSON 数据
    - name: Categorize JSON by Category
      if: ${{ env.NEED_UPDATE == 'true' }}
      run: |
        # 创建输出目录
        mkdir -p ${{ env.WORK_DIR }}/_data/neodb
    
        # 提取所有 category 值
        categories=$(jq -r '.data[].item.category' ${{ env.WORK_DIR }}/_data/neodb/neodb_data.json | tr -d '"' | sort | uniq)
        # categories=$(jq -r '.data[].item.category | unique[]' ${{ env.WORK_DIR }}/_data/neodb/neodb_data.json)
    
        # 按 category 分类并保存为单独的文件
    
        for category in $categories; do
          jq --arg cat "$category" '{data: [.data[] | select(.item.category == $cat)]}' ${{ env.WORK_DIR }}/_data/neodb/neodb_data.json > ${{ env.WORK_DIR }}/_data/neodb/${category}.json
        done
    
        echo "JSON 数据已按 category 分类！"

    - name: Download NeoDB Cover
      if: ${{ env.NEED_UPDATE == 'true' }}
      run: |
        # 检查 neodb_data 目录是否存在，如果不存在则创建
        if [ ! -d "neodb_data" ]; then
          mkdir neodb_data
        fi

        # 读取本地的 neodb_data.json 文件内容
        json=$(cat _data/neodb/neodb_data.json)

        # 提取图片 URL（过滤掉 null / 空值，防止 curl 去解析 "null" 主机名）
        image_urls=$(echo "$json" | jq -r '.data[].item.cover_image_url // empty')

        # 打印没有封面的条目，方便排查是哪一本/哪一部
        echo "$json" | jq -r '.data[] | select(.item.cover_image_url == null or .item.cover_image_url == "") | "No cover image: \(.item.uuid) | \(.item.category) | \(.item.title // .item.display_title // "?")"'

        # 遍历图片 URL 并下载图片
        for url in $image_urls; do
          # 双保险：跳过空 URL
          if [ -z "$url" ]; then
            echo "Skipping empty URL"
            continue
          fi
          filename=$(basename "$url")
          filepath="${{ env.WORK_DIR }}/assets/images/neodb/$filename"
          # 检查文件是否已存在
          if [ -f "$filepath" ]; then
            echo "Skipping $filename - File already exists"
          else
            # 使用 curl 命令下载图片；下载失败也不中断整个流程
            if curl -fsSL --retry 2 -o "$filepath" "$url"; then
              echo "Downloaded $filename"
            else
              echo "Failed to download $url - skipped"
            fi
          fi
        done

    # 把修改后的数据提交到 GitHub 仓库
    - name: Git Add and Commit
      if: ${{ env.NEED_UPDATE == 'true' }}
      uses: EndBug/add-and-commit@v9
      with:
        message: 'chore(data): update neodb data'
        committer_name: 'github-actions[bot]'
        committer_email: 'github-actions[bot]@users.noreply.github.com'
        add: |
          './_data/neodb'
          './assets/images/neodb'
